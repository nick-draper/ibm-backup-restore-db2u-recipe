<svg xmlns="http://www.w3.org/2000/svg" id="db2u-architecture-light" viewBox="0 0 1200 1092" width="1200" height="1092" role="img" aria-labelledby="db2u-architecture-light-t db2u-architecture-light-d"><title id="db2u-architecture-light-t">Recipe architecture</title><desc id="db2u-architecture-light-d">Recipe architecture. The parent recipe db2u-control wraps the child recipe, which holds every hook: Fusion's transaction-manager runs the child's annotation hooks, which pause and unpause the Db2uInstance and Db2uEngine and set the restore target project's display name to Restored with the source namespace, and the child execs manage_snapshots in the db2u pod in db2u-instance. Backup and Restore CRs run the parent; a Restore names the Transform, which rewrites the restored objects in db2u-instance-dev. The policy assignment names the application, the parent recipe and the backup policy, which writes to the backup storage location. The storage location and Fusion Velero in ibm-backup-restore both use S3 object storage; on a restore, Velero reads the data back and restores it into db2u-instance-dev.</desc><style>#db2u-architecture-light text{font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}#db2u-architecture-light .ttl{font-size:20px;font-weight:600;fill:#161616;letter-spacing:-0.01em}#db2u-architecture-light .sub{font-size:13px;fill:#525252}#db2u-architecture-light .fig{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}#db2u-architecture-light .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}#db2u-architecture-light .h{font-size:14px;font-weight:600;fill:#161616}#db2u-architecture-light .hm{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;font-weight:600;fill:#161616}#db2u-architecture-light .gh{font-size:13px;font-weight:600;fill:#161616}#db2u-architecture-light .b{font-size:12.5px;fill:#161616}#db2u-architecture-light .m{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#525252}#db2u-architecture-light .mv{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:500;fill:#161616}#db2u-architecture-light .lab{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;fill:#525252}#db2u-architecture-light .labd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#750E13}#db2u-architecture-light .hd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}</style><defs><marker id="db2u-architecture-light-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-architecture-light-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-architecture-light-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#007D79" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-architecture-light-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#B28600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-architecture-light-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#A2191F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-architecture-light-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:#E8E8E8"/></pattern></defs><rect width="1200" height="1092" rx="10" style="fill:#FFFFFF"/><rect width="1200" height="1092" rx="10" fill="url(#db2u-architecture-light-pat)"/><text x="40" y="52" class="ttl">Recipe architecture</text><text x="40" y="76" class="sub">Every component you deploy, and what calls what.</text><g><rect x="64" y="112" width="472" height="336" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="80" y="127" width="7" height="7" style="fill:#0F62FE"/><text x="94" y="134" class="eye" style="fill:#0043CE">PARENT RECIPE</text><text x="80" y="158" class="h">db2u-control</text><text x="80" y="180" class="b">Anchor group for the namespace variable</text><text x="80" y="199" class="b">Calls the child's backup and restore workflows</text><text x="80" y="218" class="m">no hooks of its own</text></g><g><rect x="80" y="232" width="440" height="200" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="96" y="247" width="7" height="7" style="fill:#0F62FE"/><text x="110" y="254" class="eye" style="fill:#0043CE">CHILD RECIPE</text><text x="96" y="278" class="h">db2u-workflow</text><text x="96" y="300" class="b">Pauses the instance and engine, then unpauses</text><text x="96" y="319" class="b">Backup: configmaps, secrets and the Db2uInstance</text><text x="96" y="338" class="b">Suspends writes, backs up the volumes, resumes</text><text x="96" y="357" class="b">Restore: volumes, resources, then snapshot restore</text><text x="96" y="376" class="b">Waits for Ready, then names the target project</text><text x="96" y="395" class="m">found by parent-recipe label</text></g><g><rect x="632" y="112" width="496" height="124" rx="4" style="fill:#FFFFFF;stroke:#B28600" stroke-width="1"/><rect x="648" y="127" width="7" height="7" style="fill:#B28600"/><text x="662" y="134" class="eye" style="fill:#684E00">FUSION · HOOK RUNNER</text><text x="648" y="158" class="h">transaction-manager</text><text x="648" y="180" class="b">Pauses and unpauses the instance and engine</text><text x="648" y="199" class="b">Names the target project: Restored db2u-instance</text><text x="648" y="218" class="m">Fusion's own account · can patch Db2u</text></g><g><rect x="632" y="268" width="496" height="180" rx="4" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><rect x="648" y="283" width="7" height="7" style="fill:#007D79"/><text x="662" y="290" class="eye" style="fill:#005D5D">NAMESPACE · BACKUP SCOPE</text><text x="648" y="314" class="h">db2u-instance</text></g><rect x="656" y="340" width="148" height="64" rx="0" style="fill:#FFFFFF;stroke:#E0E0E0" stroke-width="1"/><text x="670" y="367" class="h">Pod</text><text x="670" y="386" class="m">container db2u</text><rect x="816" y="340" width="148" height="64" rx="0" style="fill:#FFFFFF;stroke:#E0E0E0" stroke-width="1"/><text x="830" y="367" class="h">Db2uInstance</text><text x="830" y="386" class="m">dwdb</text><rect x="976" y="340" width="148" height="64" rx="0" style="fill:#FFFFFF;stroke:#E0E0E0" stroke-width="1"/><text x="990" y="367" class="h">Db2uEngine</text><text x="990" y="386" class="m">db2wh engine</text><text x="656" y="430" class="m">configmaps · secrets · PVCs</text><g><rect x="64" y="480" width="472" height="104" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="80" y="495" width="7" height="7" style="fill:#0F62FE"/><text x="94" y="502" class="eye" style="fill:#0043CE">OPERATIONS</text><text x="80" y="526" class="h">Backup and Restore CRs</text><text x="80" y="548" class="m">Backup: application, backupPolicy</text><text x="80" y="567" class="m">Restore: backup, recipe, transform, namespaceMapping</text></g><g><rect x="632" y="480" width="496" height="104" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="648" y="495" width="7" height="7" style="fill:#0F62FE"/><text x="662" y="502" class="eye" style="fill:#0043CE">TRANSFORM</text><text x="648" y="526" class="h">db2u-instance-restore-transform</text><text x="648" y="548" class="b">Rewrites ENV affinity and labels on restore</text><text x="648" y="567" class="m">named by each Restore</text></g><g><rect x="64" y="616" width="472" height="124" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="80" y="631" width="7" height="7" style="fill:#0F62FE"/><text x="94" y="638" class="eye" style="fill:#0043CE">ASSIGNMENT</text><text x="80" y="662" class="h">Policy assignment</text><text x="80" y="684" class="m">application: db2u-instance</text><text x="80" y="703" class="m">backupPolicy: db2u-instance-backup-policy</text><text x="80" y="722" class="m">recipe: db2u-control</text></g><g><rect x="632" y="616" width="496" height="124" rx="4" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><rect x="648" y="631" width="7" height="7" style="fill:#007D79"/><text x="662" y="638" class="eye" style="fill:#005D5D">NAMESPACE · RESTORE TARGET</text><text x="648" y="662" class="h">db2u-instance-dev</text><text x="648" y="684" class="b">Restored instance, PVCs, configmaps, secrets</text><text x="648" y="703" class="m">display name set by hook · ENV rewritten by Transform</text></g><g><rect x="64" y="772" width="472" height="124" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="80" y="787" width="7" height="7" style="fill:#0F62FE"/><text x="94" y="794" class="eye" style="fill:#0043CE">BACKUPPOLICY</text><text x="80" y="818" class="h">Backup policy</text><text x="80" y="840" class="m">db2u-instance-backup-policy</text><text x="80" y="859" class="m">daily 04:00 · keep 5 days</text></g><g><rect x="632" y="772" width="496" height="124" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="648" y="787" width="7" height="7" style="fill:#0F62FE"/><text x="662" y="794" class="eye" style="fill:#0043CE">NAMESPACE · FUSION AGENT</text><text x="648" y="818" class="h">ibm-backup-restore</text><text x="648" y="840" class="b">Fusion DataProtectionApplication (Velero)</text><text x="648" y="859" class="m">db2-veleroplugin installed</text></g><g><rect x="64" y="928" width="472" height="124" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="80" y="943" width="7" height="7" style="fill:#0F62FE"/><text x="94" y="950" class="eye" style="fill:#0043CE">BACKUPSTORAGELOCATION</text><text x="80" y="974" class="h">Storage location</text><text x="80" y="996" class="m">db2u-instance-backup-storage-location</text><text x="80" y="1015" class="m">secret: S3 key pair · cert: endpoint CA</text></g><g><rect x="632" y="928" width="496" height="124" rx="4" style="fill:#FFFFFF;stroke:#A8A8A8" stroke-width="1"/><rect x="648" y="943" width="7" height="7" style="fill:#A8A8A8"/><text x="662" y="950" class="eye" style="fill:#525252">EXTERNAL · S3-COMPATIBLE</text><text x="648" y="974" class="h">Object storage</text><text x="648" y="996" class="m">bucket: db2u-instance-bucket</text><text x="648" y="1015" class="m">endpoint with its CA · access key pair</text></g><path d="M520 256H584V174H628" fill="none" style="stroke:#B28600" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-cau)"/><rect x="562.3" y="210" width="43.5" height="17" rx="3" style="fill:#FFFFFF"/><text x="584" y="222" class="lab" text-anchor="middle">hooks</text><path d="M520 372H652" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)"/><rect x="575.4" y="352" width="37.2" height="17" rx="3" style="fill:#FFFFFF"/><text x="594" y="364" class="lab" text-anchor="middle">exec</text><path d="M890 236V336" fill="none" style="stroke:#B28600" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-cau)"/><path d="M1050 236V336" fill="none" style="stroke:#B28600" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-cau)"/><rect x="664.1" y="245" width="219.9" height="17" rx="3" style="fill:#FFFFFF"/><text x="878" y="257" class="lab" text-anchor="end">PATCH maintenance-pause-reconcile</text><path d="M300 480V452" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)"/><rect x="306.0" y="458" width="37.2" height="17" rx="3" style="fill:#FFFFFF"/><text x="312" y="470" class="lab" text-anchor="start">runs</text><path d="M536 532H628" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)"/><rect x="560.3" y="512" width="43.5" height="17" rx="3" style="fill:#FFFFFF"/><text x="582" y="524" class="lab" text-anchor="middle">names</text><path d="M880 584V612" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)"/><rect x="886.0" y="590" width="62.4" height="17" rx="3" style="fill:#FFFFFF"/><text x="892" y="602" class="lab" text-anchor="start">rewrites</text><path d="M64 678H52V280H60" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)"/><path d="M300 740V768" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)"/><rect x="306.0" y="746" width="43.5" height="17" rx="3" style="fill:#FFFFFF"/><text x="312" y="758" class="lab" text-anchor="start">names</text><path d="M300 896V924" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)"/><rect x="306.0" y="902" width="68.7" height="17" rx="3" style="fill:#FFFFFF"/><text x="312" y="914" class="lab" text-anchor="start">writes to</text><path d="M536 990H628" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)"/><rect x="557.1" y="970" width="49.8" height="17" rx="3" style="fill:#FFFFFF"/><text x="582" y="982" class="lab" text-anchor="middle">S3 API</text><path d="M880 900V924" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)" marker-start="url(#db2u-architecture-light-m-pri)"/><rect x="886.0" y="902" width="156.9" height="17" rx="3" style="fill:#FFFFFF"/><text x="892" y="914" class="lab" text-anchor="start">backup and restore data</text><path d="M880 772V744" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-light-m-pri)"/><rect x="886.0" y="750" width="93.9" height="17" rx="3" style="fill:#FFFFFF"/><text x="892" y="762" class="lab" text-anchor="start">restores into</text></svg>
