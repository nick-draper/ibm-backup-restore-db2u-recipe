# Secret: CA certificate of the object-storage endpoint
#
# Holds the endpoint's CA certificate under tls.crt, named by
# privateCertificateName on the BackupStorageLocation. scripts/render.sh reads
# the PEM file that S3_CA_CERT names and base64-encodes it into tls.crt. With
# S3_CA_CERT empty (a publicly trusted endpoint), it skips this file and drops
# privateCertificateName from backup-storage-location.yaml.
#
# Values from .env: FUSION_NS, S3_CA_CERT
# Apply: oc apply -f build/ibm-backup-restore/backend-storage-location/ca-cert-secret.yaml
# Used in: docs/deployment-guide.md section 4.2
---
kind: Secret
apiVersion: v1
metadata:
  name: minio-registry-cert-secret
  namespace: ${FUSION_NS}
data:
  tls.crt: ${S3_CA_CERT_DATA}
type: Opaque
...
