# Secret: object-storage access key pair
#
# The key pair Fusion uses to reach the bucket, named by credentialName on
# the BackupStorageLocation. The rendered copy in build/ holds the real keys:
# never commit it. The pre-commit hook blocks a filled-in template.
#
# Values from .env: FUSION_NS, S3_ACCESS_KEY_ID, S3_ACCESS_KEY
# Apply: oc apply -f build/ibm-backup-restore/backend-storage-location/secret.yaml
# Used in: docs/deployment-guide.md section 4.2
---
kind: Secret
apiVersion: v1
metadata:
  name: db2u-instance-backup-secret
  namespace: ${FUSION_NS}
stringData:
  access-key-id: '${S3_ACCESS_KEY_ID}'
  secret-access-key: '${S3_ACCESS_KEY}'
type: Opaque
...
